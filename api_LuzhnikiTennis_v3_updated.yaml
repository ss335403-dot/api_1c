      summary: Забронировать временные интервалы {booking_rental}
      operationId: booking_rental
      description: |
        Метод бронирует временные интервалы для оплаты клиентом (создает запись в регистре сведений «МассовоеБронированиеАренды»).
        При бронировании платной раздевалки (сьюта) в теле запроса передается:
        - `locker_room_id` — ID (UUID) услуги улучшения раздевалки (поле `service_id` из метода `locker_rooms`) ЛИБО ID помещения сьюта (поле `id` из метода `locker_rooms`). При передаче ID помещения 1С автоматически сопоставляет его с нужной услугой улучшения.
        - `locker_room_count` — количество запрашиваемых раздевалок (1 или 2). По умолчанию: 1.
        Метод автоматически подбирает свободные раздевалки указанной услуги (приоритетно в той же локации, что и корт) и сохраняет их в регистре брони.
        После успешной оплаты брони в структуре занятия возвращается массив раздевалок `locker_rooms` (и алиас `locker_room`), общий статус ключей `locker_key_issued` (false - если ключи ожидают выдачи на рецепции) и сообщение `locker_key_message`.
      tags:
      - Аренда зала
      parameters:
      - name: club_id
        in: query
        description: Идентификатор структурной единицы
        required: true
        schema:
          type: string
      - name: room_id
        in: query
        description: Идентификатор помещения
        schema:
          type: string
      - name: mass_booking
        in: query
        description: Признак массового бронирования
        schema:
          type: boolean 
      requestBody:
        content:
          application/json:
            examples:
              example:
                value:
                  room_id: c3c60072-1e55-11ef-b1bf-f02f7488d897
                  start_date: 2026-02-17 00:00
                  end_date: 2026-03-17 00:00
                  schedule:
                  - day: 1
                    times:
                    - '15:00'
                    - '16:00'
                  - day: 2
                    times:
                    - '15:00'
                    - '16:00'
                  locker_room_id: 445e1400-013f-11f1-8939-0050568b5c63
                  locker_room_count: 1
            schema:
              type: object
              properties:
                room_id:
                  type: string
                  description: Идентификатор помещения корта
                start_date:
                  type: string
                  description: Начало интервала
                end_date:
                  type: string
                  description: Конец интервала
                schedule:
                  description: Расписание выбранных интервалов
                  $ref: '#/components/schemas/RentalScheduleTimes'
                locker_room_id:
                  type: string
                  description: 'Идентификатор (UUID) услуги улучшения раздевалки (поле service_id из locker_rooms) ЛИБО помещения сьюта (поле id из locker_rooms). Если параметр не передан — сьют не бронируется (общая раздевалка).'
                locker_room_count:
                  type: integer
                  description: Количество запрашиваемых раздевалок (1 или 2). Если параметр не передан или равен 0, по умолчанию принимается 1.
              required:
              - room_id
              - start_date
              - end_date
              - schedule
