          \ возвращается в методе [{interval_rental}](#operation/interval_rental))\n\
          \  - **date_time** - Время записи\n  - **duration** - Длительность\n  -\
          \ **rental_id** - Идентификатор аренды\n  - **optional_services**: - Дополнительные\
          \ услуги\n    - **service_id** - Идентификатор услуги\n    - **count** -\
          \ количество\n    - **employee_id** - Идентификатор сотрудника (если это\
          \ персональное занятие)\n - **cart_pay** (структура с передаваемыми оплатами,\
          \ если не указан, в структура возврата не будет структуры \"cart_pay\")\n\
          \n\nПример такой строки:\n{\"cart_array\":[{\"record_array\": [{\"date_time\"\
          : \"2023-02-27 19:00:00\",\"duration\": 120, \"rental_id\": \"04e58135-05a0-11f1-b20b-001a7dda7115\"\
          , \"optional_services\": [{\"service_id\":\"ee176080-5bbe-11ef-b1c6-001a7dda7115\"\
          ,\"count\":1},{\"service_id\":\"ad0b3d26-a51e-11f0-b1fe-001a7dda7115\",\"\
          count\":1,\"employee_id\":\"3b680210-2d51-11ee-b18e-f02f7488d897\"}]},{\"\
          date_time\": \"2023-02-27 22:00:00\",\"duration\": 60}],\"service_id\":\
          \ \"37515859-3721-11ec-b135-f02f7488d897\",\"room_id\": \"e07e5bc4-2bf9-11ec-910f-2c4d546557dd\"\
          }], \"cart_pay\":{\"pay_deposit\":[{\"id\":\"cb0a9cab-bb83-11ee-b1a3-f02f7488d897\"\
          ,\"val\":\"11600\"},{\"id\":\"f9c4beff-bb86-11ee-b1a3-f02f7488d897\",\"\
          val\":\"\"}],\"pay_bonus\":null,\"pay_certificate\":null}}\n"
