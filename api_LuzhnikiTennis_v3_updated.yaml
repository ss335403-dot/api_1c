        schema:
          type: string
      - name: type
        in: query
        description: Идентификатор типа помещения
        schema:
          type: string
      - name: location
        in: query
        description: Идентификатор локации помещения
        schema:
          type: string
      - name: coating
        in: query
        description: Идентификатор покрытия помещения
        schema:
          type: string
