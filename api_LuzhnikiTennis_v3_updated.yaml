          description: Общая сумма оплаты с лицевого счета
          type: number
        may_be_payment:
          $ref: '#/components/schemas/MayBePayment'
        promotions:
          description: Массив применяемых скидок и бонусов
          type: array
          items:
            type: object
            properties:
              type:
                description: 'Тип скидки:

                  - bonus - Бонус

                  - discount - Скидка

                  - gift - Подарок

                  '
                type: string
              title:
                $ref: '#/components/schemas/Title'
              amount:
                description: Сумма скидки
                type: number
            required:
            - type
            - title
            - amount
        use_sberbank_fiscalization:
          description: Признак фискализации в банке
          type: boolean
        client:
          description: Структура клиента
          type: object
          properties:
            id:
              $ref: '#/components/schemas/ID'
            full_name:
              description: ФИО клиента
              type: string
            email:
              description: Электронная почта
              type: string
            phone:
              description: Номер телефона
              type: string
        org_id:
          description: Идентификатор организации
          $ref: '#/components/schemas/ID'
        club_id:
          description: Идентификатор клуба
          $ref: '#/components/schemas/ID'
        deposit_sufficient:
          type: boolean
          description: Признак того, что на лицевом счете достаточно средств для оплаты.
        deposit_top_up_amount:
          type: number
          format: float
          description: Сумма, на которую необходимо пополнить лицевой счет для оплаты.
    LockerRoomItem:
      type: object
      description: Объект забронированной раздевалки / сьюта
      properties:
        id:
          type: string
          description: Идентификатор помещения раздевалки
          example: 7a9b1234-5678-90ab-cdef-1234567890ab
        title:
          type: string
          description: Наименование раздевалки
          example: Сьют Москва 4
        description:
          type: string
          description: Описание помещения
        photo:
          type: string
          nullable: true
          description: URL основной фотографии раздевалки
        pictures:
          type: array
          description: Массив URL всех фотографий раздевалки
          items:
            type: string
        start_date:
          type: string
          description: Дата и время начала аренды раздевалки (yyyy-MM-dd HH:mm)
          example: '2026-12-20 09:00'
        end_date:
          type: string
          description: Дата и время окончания аренды раздевалки (yyyy-MM-dd HH:mm)
          example: '2026-12-20 10:30'
        duration:
          type: integer
          description: Длительность аренды раздевалки в минутах
          example: 90
        price:
          type: number
          description: Цена услуги раздевалки
          example: 3000
        sum:
          type: number
          description: Итоговая сумма аренды раздевалки
          example: 3000
        is_paid:
          type: boolean
          description: Признак оплаты аренды раздевалки
          example: true
        service:
          type: object
          description: Услуга раздевалки
          properties:
            id:
              type: string
              description: Идентификатор услуги
            title:
              type: string
              description: Наименование услуги
        card:
          type: object
          nullable: true
          description: Привязанная карта/ключ СКУД (null, если ключ еще не привязан)
          properties:
            id:
              type: string
              description: Идентификатор карты
            code:
              type: string
              description: Номер/код карты
            title:
              type: string
              description: Представление карты
        key_issued:
          type: boolean
          description: Флаг привязки/выдачи карты СКУД (true - выдана, false - ожидает выдачи на рецепции)
        physical_key_required:
          type: boolean
          description: Признак необходимости подойти на рецепцию за физическим ключом/картой
        access_type:
          type: string
          enum:
          - reception
          - card
          description: 'Вид доступа: reception (получить на рецепции клуба), card (выдана карта/браслет)'
        key_message:
          type: string
          description: Подсказка для клиента о ключе
      required:
      - id
      - title
      - start_date
      - end_date
      - duration
      - key_issued
      - physical_key_required