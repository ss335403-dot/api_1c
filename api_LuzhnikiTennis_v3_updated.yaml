      summary: Создать аренду зала {interval_rental}
      operationId: interval_rental
      description: |
        Метод осуществляет аренду помещения и возвращает структуру с данными о созданной аренде. Отличается от метода [{rental}](#operation/post_rental) тем, что принимает сразу несколько интервалов для создания аренды. В результате выполнения может быть создано несколько занятий.

        ---
        ### 1. Первичное бронирование (без сьюта или сразу со сьютом)
        - `service_id` — ID услуги аренды корта
        - `room_id` — ID корта / помещения
        - `record_array` — массив интервалов (`date_time`, `duration`)
        - `locker_room_id` *(опционально)* — ID (UUID) услуги улучшения раздевалки (поле `service_id` из метода `locker_rooms`) ЛИБО ID помещения сьюта (поле `id` из метода `locker_rooms`). При передаче ID помещения 1С автоматически сопоставляет его с нужной услугой улучшения. Если параметр не передан — сьют не бронируется.
        - `locker_room_count` *(опционально)* — количество запрашиваемых раздевалок (1 или 2). По умолчанию: 1.

        Для каждого интервала из пачки автоматически подбирается свободная раздевалка (сьют) с учетом временного буфера (+/- 30 минут к занятию). Если на какой-либо интервал нет свободных сьютов, метод возвращает ошибку 1080.
        При успешном создании временной брони возвращается массив созданных занятий `rentals` и корзина `cart` для последующей оплаты через `payment_link`.

        ---
        ### 2. Добавление сьютов к ранее созданным арендам кортов (Upgrade / Доплата разницы)
        Если клиент изначально создал аренду корта БЕЗ сьюта, а затем решил добавить сьют (на этапе оформления заказа/корзины или уже после оплаты корта):

        #### Что передавать фронтенду в теле запроса:
        Фронтенд отправляет повторный запрос `POST /hs/api/v3/interval_rental/` со следующими полями:
        1. `service_id` и `room_id` — те же самые ID услуги и корта, что и при создании аренды.
        2. `locker_room_id` — ID услуги или помещения выбранного сьюта.
        3. `locker_room_count` — количество сьютов (`1` или `2`).
        4. В массиве `record_array` для каждого слота обязательно передать `rental_id` (UUID ранее созданного документа «Занятие», полученный из предыдущего ответа в `data.rentals[].rental.id` или `data.cart[0].record_array[].rental_id`):

        ```json
        {
          "service_id": "a503fa44-366a-11ec-b135-f02f7488d897",
          "room_id": "e07e5bc4-2bf9-11ec-910f-2c4d546557dd",
          "locker_room_id": "445e1400-013f-11f1-8939-0050568b5c63",
          "locker_room_count": 1,
          "record_array": [
            {
              "date_time": "2026-09-30 10:00:00",
              "duration": 60,
              "rental_id": "8e3dba61-2440-11f1-96dd-0050568b5c63"
            },
            {
              "date_time": "2026-09-30 11:00:00",
              "duration": 60,
              "rental_id": "9f4eca72-3551-11f1-97ee-0050568b5c64"
            }
          ]
        }
        ```
        *(Также допускается передать `rental_id` строкой на верхнем уровне JSON через запятую: `"rental_id": "8e3dba61-..., 9f4eca72-..."`, однако передача `rental_id` внутри каждого элемента `record_array` является рекомендуемой).*

        #### Что делает 1С и как оплачивается разница:
        1. **Документы «Занятие» НЕ дублируются:** 1С находит существующие документы занятий по переданным `rental_id` и обновляет их — подбирает свободные сьюты, записывает их в документ и добавляет услугу сьюта в состав занятия.
        2. **Расчет корзины `cart` и доплата:**
           - **Сценарий А: Корты были во временной брони (ещё НЕ оплачены):**
             В возвращаемом `cart` будут содержаться как интервалы корта, так и услуга сьюта. Фронтенд передает полученный `cart` в `POST /hs/api/v3/payment_link`, и клиент оплачивает весь заказ (корт + сьют) целиком.
           - **Сценарий Б: Корты уже были ОПЛАЧЕНЫ клиентом ранее:**
             1С определяет, что корт уже оплачен. В возвращаемом ответе оплаченные корты автоматически исключаются из позиций к оплате, и в массиве `cart` возвращается **ТОЛЬКО позиция сьюта**:
             ```json
             "cart": [
               {
                 "service_id": "445e1400-013f-11f1-8939-0050568b5c63",
                 "count": 2
               }
             ]
             ```
             Фронтенд передает данный `cart` в метод `POST /hs/api/v3/payment_link`, в результате чего генерируется ссылка на оплату **только стоимости сьютов (доплата разницы)**.

        ---
        ### 3. Автоматическая привязка карты СКУД (ключа от раздевалки)
        При бронировании раздевалки 1С проверяет наличие зарегистрированной активной карты/браслета клиента в клубе:
        - **Если у клиента есть карта в клубе:** 1С автоматически привязывает её к забронированному сьюту:
          - `card`: `{ "id": "...", "code": "123", "title": "123, Фамилия Имя" }`
          - `key_issued`: `true`
          - `physical_key_required`: `false`
          - `access_type`: `"card"`
          - `key_message`: `""`
          - `locker_key_issued`: `true` (на уровне занятия)
          *(Фронтенд может показать пользователю: «Доступ в раздевалку по вашей карте №123»).*
        - **Если карты в клубе нет:**
          - `card`: `null`
          - `key_issued`: `false`
          - `physical_key_required`: `true`
          - `access_type`: `"reception"`
          - `key_message`: `"Ключ от раздевалки необходимо получить на рецепции клуба"`
          - `locker_key_issued`: `false`
          *(Фронтенд отображает подсказку о необходимости получить ключ на рецепции).*
      tags:
      - Аренда зала
      parameters:
      - name: usertoken
        in: header
        description: Ключ клиента
        required: true
        schema:
          type: string
        example: 580392-e6ba49428-0ac67fcd-f2180121
      requestBody:
        content:
          application/json:
            example:
              record_array:
              - date_time: '2022-02-08T11:30:00'
                duration: 15
                rental_id: f2adaa8f-6cb4-11ed-b167-f02f7488d897
              - date_time: '2022-02-08T11:45:00'
                duration: 15
                rental_id: e07e5bc4-8bf9-11ec-910f-2c4d546557dd
              - date_time: '2022-02-08T12:30:00'
                duration: 15
                rental_id: 885fa908-ed18-4dde-a376-32ff921b8783
              service_id: a503fa44-366a-11ec-b135-f02f7488d897
              room_id: e07e5bc4-2bf9-11ec-910f-2c4d546557dd
              locker_room_id: 445e1400-013f-11f1-8939-0050568b5c63
              locker_room_count: 1
              resources:
              - e07e5bc4-8bf9-11ec-910f-2c4d546557dd
            schema:
              type: object
              properties:
                rental_id:
                  type: string
                  description: Идентификатор аренды. Если передаётся этот параметр,
                    то остальные параметры не требуются
                ticket_id:
                  type: string
                  description: Идентификатор основания оплаты
                service_id:
                  type: string
                  description: Идентификатор услуги
                room_id:
                  type: string
                  description: Идентификатор помещения
                locker_room_id:
                  type: string
                  description: 'Идентификатор (UUID) услуги улучшения раздевалки (поле service_id из locker_rooms) ЛИБО помещения сьюта (поле id из locker_rooms). Если параметр не передан — сьют не бронируется (общая раздевалка).'
                locker_room_count:
                  type: integer
                  description: Количество запрашиваемых раздевалок (1 или 2). Если параметр не передан или равен 0, по умолчанию принимается 1.
                record_array:
                  $ref: '#/components/schemas/RecordRental'
